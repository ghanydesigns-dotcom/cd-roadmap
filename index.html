<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CD Roadmap Progress</title>
<style>
  :root{
    --bg:#f8fafc;--card:#ffffff;--line:#e2e8f0;--ink:#1e293b;--muted:#64748b;--faint:#94a3b8;
    --track:#f1f5f9;--fill:#22c55e;--pill-bg:#dcfce7;--pill-ink:#15803d;
    --soft-bg:#f1f5f9;--soft-ink:#475569;--amber-bg:#fef3c7;--amber-ink:#b45309;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f172a;--card:#1e293b;--line:#334155;--ink:#f1f5f9;--muted:#94a3b8;--faint:#64748b;
      --track:#334155;--fill:#4ade80;--pill-bg:#14532d;--pill-ink:#bbf7d0;
      --soft-bg:#334155;--soft-ink:#cbd5e1;--amber-bg:#78350f;--amber-ink:#fde68a;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:26px 16px 40px}
  .wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
  .top{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
  .titlecard{display:flex;align-items:center}
  .titlecard .head{width:100%}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media (max-width:900px){
    .top{grid-template-columns:1fr 1fr}
    .top .titlecard{grid-column:1 / -1}
    .grid{grid-template-columns:repeat(2,1fr)}
  }
  @media (max-width:520px){
    body{padding:16px 16px 32px}
    .grid{grid-template-columns:1fr}
    .big{font-size:34px}
    .meta{flex-wrap:wrap;gap:6px}
  }
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 17px}
  .head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .title{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
  .title svg{width:16px;height:16px;color:var(--muted)}
  .pill{font-size:11px;padding:3px 8px;border-radius:6px;background:var(--pill-bg);color:var(--pill-ink);white-space:nowrap}
  .pill.soft{background:var(--soft-bg);color:var(--soft-ink)}
  .pill.amber{background:var(--amber-bg);color:var(--amber-ink)}
  .label{font-size:12px;color:var(--muted);font-weight:500}
  .big{font-size:40px;font-weight:600;letter-spacing:-.5px;margin:4px 0 10px}
  .bar{height:6px;border-radius:99px;background:var(--track);overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:var(--fill);border-radius:99px;transition:width .8s ease}
  .sub{font-size:12px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between;gap:8px}
  .stat .num{font-size:22px;font-weight:600;margin-top:4px}
  .stat .unit{font-size:12px;color:var(--muted);margin-top:2px}
  .phase{display:flex;flex-direction:column;gap:8px}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .pname{font-size:14px;font-weight:600}
  .pname span{color:var(--faint);font-weight:500;margin-right:4px}
  .pct{font-size:14px;font-weight:600}
  .grid{align-items:start}
  .tasks{border-top:1px solid var(--line);margin-top:2px;padding-top:8px}
  .tasks summary{font-size:12px;font-weight:500;color:var(--ink);cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
  .tasks summary::-webkit-details-marker{display:none}
  .tasks summary::after{content:"";width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);margin:0 3px 3px 0;transition:transform .2s}
  .tasks[open] summary::after{transform:rotate(-135deg);margin:3px 3px 0 0}
  .tlist{max-height:360px;overflow-y:auto;margin-top:8px;padding-right:2px}
  .glabel{font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 4px}
  .glabel:first-child{margin-top:0}
  .tasks ul{list-style:none;display:flex;flex-direction:column;gap:5px}
  .tasks li{font-size:12px;line-height:1.4;color:var(--ink);display:grid;grid-template-columns:14px 1fr;column-gap:7px}
  .tasks li > .subs{grid-column:2;margin-top:5px}
  .tasks li.done > span:nth-child(2){color:var(--faint);text-decoration:line-through}
  .box{width:14px;height:14px;border:1.5px solid var(--line);border-radius:4px;margin-top:1px;display:flex;align-items:center;justify-content:center}
  .box svg{width:10px;height:10px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:0}
  li.done > .box{background:var(--fill);border-color:var(--fill)}
  li.done > .box svg{opacity:1}
  .meta{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
  .meta .pill{align-self:flex-start}
  .section{font-size:12px;color:var(--muted);font-weight:500;margin:6px 2px -2px}
  footer{text-align:right;font-size:11px;color:var(--faint);margin-top:4px}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="card titlecard">
      <div class="head">
        <div class="title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
          Creative Director Roadmap
        </div>
        <span class="pill" id="weekPill">Week 1 / 32</span>
      </div>
    </div>
    <div class="card stat">
      <div class="label">Time elapsed</div>
      <div class="num" id="timePct">0%</div>
      <div class="unit" id="dayLine"></div>
    </div>
    <div class="card stat">
      <div class="label">Setup</div>
      <div class="num" id="setupNum">0/0</div>
      <div class="unit" id="setupLine"></div>
    </div>
  </div>

  <div class="card">
    <div class="label">Overall progress</div>
    <div class="big" id="overall">0%</div>
    <div class="bar"><i id="overallBar"></i></div>
    <div class="sub"><span id="tasksLine"></span><span>17 Oct 2026 → 28 May 2027</span></div>
  </div>

  <div class="section">Phases</div>
  <div id="phases" class="grid"></div>

  <footer>Mohamed Abdelghany 2026</footer>
</div>

<script>
/* ===== Update progress here: change "done" as you tick items off ===== */
const SETUP = { done: 7, total: 7 };
const PHASES = [
  { n:1, name:"The Storyteller",  weeks:"1–4",   start:"2026-10-17", end:"2026-11-13", done:2, total:38 },
  { n:2, name:"The Idea Maker",   weeks:"5–8",   start:"2026-11-14", end:"2026-12-11", done:0, total:2  },
  { n:3, name:"The Strategist",   weeks:"9–12",  start:"2026-12-12", end:"2027-01-08", done:0, total:3  },
  { n:4, name:"The Writer",       weeks:"13–16", start:"2027-01-09", end:"2027-02-05", done:0, total:2  },
  { n:5, name:"The Scriptwriter", weeks:"17–20", start:"2027-02-06", end:"2027-03-05", done:0, total:3  },
  { n:6, name:"The Presenter",    weeks:"21–24", start:"2027-03-06", end:"2027-04-02", done:0, total:2  },
  { n:7, name:"The Negotiator",   weeks:"25–28", start:"2027-04-03", end:"2027-04-30", done:0, total:2  },
  { n:8, name:"The Leader",       weeks:"29–32", start:"2027-05-01", end:"2027-05-28", done:0, total:4  }
];
const START = "2026-10-17", END = "2027-05-28";
/* Tasks per phase, synced from the roadmap doc (Claude Doc) */
const TASKS = {"1":[{"g":"Week 1 · 17–23 Oct","items":[{"t":"HubSpot Content Marketing, session 1","c":false},{"t":"How to Speak — Patrick Winston","c":true},{"t":"Story talks + reading","c":false,"s":[{"t":"The clues to a great story — Andrew Stanton","c":true},{"t":"Shapes of Stories — Kurt Vonnegut","c":true},{"t":"The Art of War, ch. I","c":false}]},{"t":"Origin story, 300 words, EN draft","c":false},{"t":"Origin story, AR version","c":false},{"t":"The Subtle Art, ch. 1","c":false}]},{"g":"Week 2 · 24–30 Oct","items":[{"t":"HubSpot Content Marketing, session 2","c":false},{"t":"Pixar + reading","c":false,"s":[{"t":"Pixar: We are all storytellers","c":false},{"t":"Pixar: Character","c":false},{"t":"The Art of War, ch. II","c":false}]},{"t":"Storyboard, part 1","c":false,"s":[{"t":"Pick the ntam project","c":false},{"t":"Frames 1–3","c":false}]},{"t":"Storyboard frames 4–6","c":false},{"t":"كيف تكتب حلقة الدحيح؟ — الدحيح","c":false}]},{"g":"Week 3 · 31 Oct – 6 Nov","items":[{"t":"Practice #1 carousel","c":false,"s":[{"t":"Build the carousel from the storyboard (4:5)","c":false},{"t":"Post on IG (caption: Same project. Different story.)","c":false},{"t":"Mirror on LinkedIn, longer English caption","c":false}]},{"t":"Pixar + reading","c":false,"s":[{"t":"Pixar: Story structure","c":false},{"t":"Pixar: Visual language","c":false},{"t":"The Art of War, ch. III","c":false}]},{"t":"Rehearse the 2-minute telling","c":false},{"t":"Record it in 2 minutes, no notes (private)","c":false},{"t":"Casual","c":false,"s":[{"t":"كيف يمكن أن تقنع الناس بفوائد التدخين والحرب؟ — الدحيح","c":false},{"t":"The Subtle Art, ch. 2","c":false}]}]},{"g":"Week 4 · 7–13 Nov","items":[{"t":"HubSpot Content Marketing, session 3","c":false},{"t":"Pixar + reading","c":false,"s":[{"t":"Pixar: Film grammar","c":false},{"t":"Pixar: Pitching and feedback","c":false},{"t":"The Art of War, ch. IV","c":false}]},{"t":"Watch the recording back; note 3 fixes","c":false},{"t":"Re-record the final 2-minute telling (private)","c":false},{"t":"لماذا لا نستطيع الهروب من فيسبوك؟ — الدحيح","c":false}]},{"g":"Week 5 · Sat 14 Nov (spillover)","items":[{"t":"HubSpot Content Marketing wrap-up","c":false,"s":[{"t":"Final sessions","c":false},{"t":"Exam: 60 questions, 75% to pass","c":false}]},{"t":"Share the certificate","c":false,"s":[{"t":"LinkedIn post","c":false},{"t":"IG story","c":false},{"t":"Set the tracker status to Done","c":false}]}]}],"2":[{"g":"Make","items":[{"t":"10 ideation sessions on one real brief → 30 rough ideas","c":false},{"t":"Pick the best 3 and write why the other 27 lost","c":false}]}],"3":[{"g":"Make","items":[{"t":"Rewrite 5 real briefs into one-line propositions","c":false},{"t":"One-slide data decision on Parallel Universe: keep, kill, change","c":false},{"t":"Proof 1: a 5-minute recorded talk on your brief method (week 12)","c":false}]}],"4":[{"g":"Make","items":[{"t":"20 headlines a day for 10 days on one brief (AR + EN)","c":false},{"t":"10 jokes a week on agency life: setup → flip → tag","c":false}]}],"5":[{"g":"Make","items":[{"t":"Transcribe 5 Ramadan ads into two-column scripts (video / audio)","c":false},{"t":"Write two 30-second scripts","c":false},{"t":"Proof 2: Spec campaign A (Arabic): insight → manifesto → key visual → 30s script → activation","c":false}]}],"6":[{"g":"Make","items":[{"t":"Proof 3: Spec campaign B (English), same structure as A","c":false},{"t":"Write 5 minutes of stand-up material (Arabic, agency life); rehearse a 60-second bit weekly","c":false}]}],"7":[{"g":"Make","items":[{"t":"Negotiate one real scope or fee using the planner; write a one-page debrief","c":false},{"t":"First open mic, 5 minutes (week 28), recorded","c":false}]}],"8":[{"g":"Make","items":[{"t":"Run 3 feedback sessions with your team using Radical Candor","c":false},{"t":"Team playbook v1: rituals, critique, briefs (1–2 pages)","c":false},{"t":"Pitch deck for campaign A; present it live, recorded, opening with your 60-second bit","c":false},{"t":"Portfolio repositioned around 6 proof pieces: brief talk, campaign A, campaign B, Parallel Universe case study, ntam leadership case, pitch video","c":false}]}]};
/* ===================================================================== */

const day = s => new Date(s + "T00:00:00");
const fmt = s => day(s).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const today = new Date(); today.setHours(0,0,0,0);

// Overall = average of the 8 phases (each phase = 4 weeks, equal weight)
// done/total come from the task tree (leaf tasks only)
const leaf = its => its.reduce((a,i) => { if (i.s) { const r = leaf(i.s); return [a[0]+r[0], a[1]+r[1]]; } return [a[0]+(i.c?1:0), a[1]+1]; }, [0,0]);
PHASES.forEach(p => { const gs = TASKS[p.n] || []; const r = gs.reduce((a,g) => { const x = leaf(g.items); return [a[0]+x[0], a[1]+x[1]]; }, [0,0]); if (r[1]) { p.done = r[0]; p.total = r[1]; } });
const pcts = PHASES.map(p => p.total ? p.done / p.total : 0);
const overall = pcts.reduce((a,b)=>a+b,0) / PHASES.length * 100;
const doneAll = PHASES.reduce((a,p)=>a+p.done,0), totalAll = PHASES.reduce((a,p)=>a+p.total,0);

const totalDays = (day(END) - day(START)) / 864e5 + 1;
const elapsed = Math.min(Math.max((today - day(START)) / 864e5 + 1, 0), totalDays);
const week = Math.min(Math.max(Math.ceil(elapsed / 7), 1), 32);

document.getElementById("overall").textContent = overall.toFixed(1) + "%";
document.getElementById("tasksLine").textContent = doneAll + " of " + totalAll + " tasks";
document.getElementById("weekPill").textContent = "Week " + week + " / 32";
document.getElementById("timePct").textContent = (elapsed / totalDays * 100).toFixed(1) + "%";
document.getElementById("dayLine").textContent = "Day " + Math.round(elapsed) + " of " + totalDays;
document.getElementById("setupNum").textContent = SETUP.done + "/" + SETUP.total;
document.getElementById("setupLine").textContent = SETUP.done === SETUP.total ? "Complete" : "In progress";

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isDone = i => i.s ? i.s.every(isDone) : i.c;
const tick = '<svg viewBox="0 0 16 16"><path d="M4 8.5l2.5 2.5L12 5.5"/></svg>';
const item = i => '<li class="' + (isDone(i) ? "done" : "") + '"><span class="box">' + tick + '</span><span>' + esc(i.t) + '</span>' +
  (i.s ? '<ul class="subs">' + i.s.map(item).join("") + '</ul>' : '') + '</li>';
function checklist(p, open) {
  const gs = TASKS[p.n] || [];
  if (!gs.length) return "";
  return '<details class="tasks"' + (open ? " open" : "") + '><summary>Tasks · ' + p.done + '/' + p.total + '</summary><div class="tlist">' +
    gs.map(g => (gs.length > 1 || g.g !== "Make" ? '<div class="glabel">' + esc(g.g) + '</div>' : '') + '<ul>' + g.items.map(item).join("") + '</ul>').join("") +
    '</div></details>';
}

const list = document.getElementById("phases");
PHASES.forEach((p, i) => {
  const pct = Math.round(pcts[i] * 100);
  let status = "Upcoming", cls = "soft";
  if (pct === 100) { status = "Done"; cls = ""; }
  else if (today >= day(p.start) && today <= day(p.end)) { status = "In progress"; cls = ""; }
  else if (today > day(p.end)) { status = "Behind"; cls = "amber"; }
  else if (p.done > 0) { status = "Started"; cls = ""; }
  const el = document.createElement("div");
  el.className = "card phase";
  el.innerHTML =
    '<div class="row"><div class="pname"><span>' + p.n + '</span>' + p.name + '</div><div class="pct">' + pct + '%</div></div>' +
    '<div class="bar"><i data-w="' + pct + '"></i></div>' +
    '<div class="meta"><span>Weeks ' + p.weeks + ' · ' + fmt(p.start) + ' – ' + fmt(p.end) + ' · ' + p.done + '/' + p.total + '</span><span class="pill ' + cls + '">' + status + '</span></div>' +
    checklist(p, status === "In progress");
  list.appendChild(el);
});

requestAnimationFrame(() => setTimeout(() => {
  document.getElementById("overallBar").style.width = overall + "%";
  document.querySelectorAll(".bar > i[data-w]").forEach(b => b.style.width = b.dataset.w + "%");
}, 60));
</script>
</body>
</html>
